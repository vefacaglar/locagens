[package]
name = "locagens-execpolicy"
version = "0.2.0"
edition = "2021"

[dependencies]
locagens-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
