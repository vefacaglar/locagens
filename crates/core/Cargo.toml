[package]
name = "locagens-core"
version = "0.1.0"
edition = "2021"
description = "Locagens pure Rust core (locagens_core library + lcgn CLI) built on top of pi."

[lib]
name = "locagens_core"
path = "src/lib.rs"

[dependencies]
locagens-config = { path = "../config" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
dirs = "5.0"
regex = "1"
base64 = "0.22"
walkdir = "2"
url = "2"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
clap = { version = "4", features = ["derive"] }
rustyline = "14"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
unicode-width = "0.2"
fs2 = "0.4"
rpassword = "7"
toml = "0.8"
locagens-protocol = { path = "../protocol" }
locagens-apply-patch = { path = "../apply-patch" }
locagens-execpolicy = { path = "../execpolicy" }
locagens-context = { path = "../context" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[dev-dependencies]
axum = "0.7"
tempfile = "3"
