[package]
name = "locagens-config"
version = "0.2.0"
edition = "2021"

[dependencies]
locagens-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
dirs = "5"

[dev-dependencies]
tempfile = "3"
axum = "0.7"
uuid = { version = "1", features = ["v4"] }
