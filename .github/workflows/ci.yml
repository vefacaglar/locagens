name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      # The desktop app (Dioxus/wry) links GTK + WebKitGTK on Linux.
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libssl-dev pkg-config
      # Pure Rust: tests + release build for the core (lcgn) and the desktop
      # app (locagens). No Node.js, pnpm, or Electron.
      # Lints are reported, not enforced (remaining warnings are style-only).
      - name: cargo clippy --workspace --all-targets
        run: |
          set -o pipefail
          status=0
          cargo clippy --workspace --all-targets 2>&1 | tee clippy.log || status=$?
          if [ "$status" -ne 0 ]; then
            grep -E -A6 "^error" clippy.log | head -n 40 | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit "$status"
      # Every failing test is also reported as an annotation (panic message
      # and the failing test names), so failures are readable from the run
      # summary without opening the full log.
      - name: cargo test --workspace
        run: |
          set -o pipefail
          status=0
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log || status=$?
          if [ "$status" -ne 0 ]; then
            grep -E "^thread '.*' panicked at|^---- .* stdout ----|^    [a-zA-Z0-9_:]+$|^error(\[E[0-9]+\])?:" test.log \
              | head -n 60 \
              | while IFS= read -r line; do echo "::error::${line}"; done
            grep -A3 -E "panicked at" test.log | grep -vE "panicked at|^--$|note: run with" | head -n 40 \
              | while IFS= read -r line; do echo "::error::  ${line}"; done
          fi
          exit "$status"
      - run: cargo build --release --workspace
