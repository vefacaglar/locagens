name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/backend
      # Rust backend: tests + release build.
      - run: cargo test --manifest-path apps/backend/Cargo.toml
      - run: cargo build --release --manifest-path apps/backend/Cargo.toml
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Shared is a runtime dependency of the frontend (resolved via dist/).
      - run: pnpm --filter @locagens/shared build
      - run: pnpm --filter @locagens/web test
      - run: pnpm build
