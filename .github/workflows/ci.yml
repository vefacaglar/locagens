name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      # Pure Rust: tests + release build for the core (lcgn) and the desktop
      # app (locagens). No Node.js, pnpm, or Electron.
      - run: cargo test -p locagens-cli -p locagens-desktop
      - run: cargo build --release -p locagens-cli -p locagens-desktop
      - run: cargo test --workspace
      - run: cargo build --release --workspace
