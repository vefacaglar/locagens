name: Release (macOS & Windows binaries)

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.2.0). Leave empty to build only without creating a release.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: 'aarch64-apple-darwin x86_64-apple-darwin'
          - os: windows-latest
            targets: 'x86_64-pc-windows-msvc'
    runs-on: ${{ matrix.os }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Update crate version from tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -e
          tagName="${INPUT_TAG_NAME:-$REF_NAME}"
          [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG_NAME" ] && tagName="$INPUT_TAG_NAME"
          version="${tagName#v}"
          case "$version" in
            [0-9]*)
              echo "Setting version to: $version"
              for cargo_toml in apps/backend/Cargo.toml apps/desktop-rs/Cargo.toml; do
                [ -f "$cargo_toml" ] || continue
                sed -i.bak -E '0,/^version[[:space:]]*=[[:space:]]*"[^"]*"/s//version = "'"$version"'"/' "$cargo_toml"
                rm -f "$cargo_toml.bak"
                echo "Updated $cargo_toml"
              done
              ;;
            *)
              echo "Skipping version update, tag/ref: $tagName"
              ;;
          esac

      # Build the desktop app (locagens) and the CLI (lcgn) for every target.
      - name: Build release binaries (desktop-rs workspace, builds locagens + lcgn)
        shell: bash
        run: |
          for target in ${{ matrix.targets }}; do
            cargo build --release --target "$target" -p locagens-desktop -p locagens-backend
          done

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          for target in ${{ matrix.targets }}; do
            for bin in locagens lcgn; do
              if [ -f "target/$target/release/$bin" ]; then cp "target/$target/release/$bin" dist/; fi
              if [ -f "target/$target/release/$bin.exe" ]; then cp "target/$target/release/$bin.exe" "dist/$bin.exe"; fi
            done
          done
          ls -lh dist/

      - name: Upload binaries as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: locagens-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release with binaries
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false
