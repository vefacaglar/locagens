name: Release (macOS & Windows binaries)

# Builds the desktop app (`locagens`) and the CLI (`lcgn`):
# - macOS: universal (Apple Silicon + Intel) Locagens.app in a DMG, plus a
#   universal `lcgn`. Signed with the Developer ID certificate and notarized
#   when the signing secrets exist; otherwise built unsigned (with a warning).
# - Windows: x86_64 `locagens.exe` + `lcgn.exe` in a zip.
# Tags (`v*`) and a dispatch with `tag_name` also publish a GitHub Release;
# a push that changes this workflow only builds (artifacts, no release).

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
    branches:
      - main
    paths:
      - '.github/workflows/release-mac.yml'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.2.0). Leave empty to build only without creating a release.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}

jobs:
  macos:
    runs-on: macos-latest
    env:
      MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin x86_64-apple-darwin

      - name: Set version from tag
        run: bash .github/scripts/set-version.sh "$RELEASE_TAG"

      - name: Build (arm64 + x86_64)
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target" -p locagens-desktop -p locagens-cli
          done

      - name: Universal binaries and app bundle
        run: |
          set -e
          version=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' apps/desktop-rs/Cargo.toml | head -1)
          mkdir -p dist build
          for bin in locagens lcgn; do
            lipo -create -output "build/$bin" \
              "target/aarch64-apple-darwin/release/$bin" "target/x86_64-apple-darwin/release/$bin"
          done
          app=build/Locagens.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp build/locagens "$app/Contents/MacOS/locagens"
          # AppIcon.icns from the 1024px PNG.
          iconset=build/AppIcon.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size apps/desktop-rs/assets/icon.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z $double $double apps/desktop-rs/assets/icon.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Locagens</string>
            <key>CFBundleDisplayName</key><string>Locagens</string>
            <key>CFBundleIdentifier</key><string>com.locagens.app</string>
            <key>CFBundleExecutable</key><string>locagens</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.developer-tools</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"

      - name: Check signing secrets
        id: signing
        run: |
          missing=""
          for name in MAC_CERTIFICATE_P12_BASE64 MAC_CERTIFICATE_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_KEY_P8; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Building UNSIGNED macOS binaries; missing secrets:$missing"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -e
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$MAC_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$identity" ]; then
            echo "::error::No 'Developer ID Application' identity in the certificate"
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Sign and notarize the app and the CLI
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -e
          trap 'echo "::error::Signing step failed at: $BASH_COMMAND"' ERR
          codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" build/lcgn
          codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" build/Locagens.app
          codesign --verify --deep --strict --verbose=2 build/Locagens.app
          mkdir -p build/notarize && cp -R build/Locagens.app build/lcgn build/notarize/
          ditto -c -k --keepParent build/notarize build/notarize.zip
          # A build-only run keeps going (signed, not notarized) when Apple
          # refuses; a release must be notarized.
          if bash .github/scripts/notarize.sh build/notarize.zip; then
            echo "NOTARIZED=true" >> "$GITHUB_ENV"
            xcrun stapler staple build/Locagens.app
            spctl --assess --type execute --verbose=4 build/Locagens.app
          elif [ -z "$RELEASE_TAG" ]; then
            echo "::warning::Not notarized (build-only run); the app is signed but Gatekeeper will ask on first launch."
            echo "NOTARIZED=false" >> "$GITHUB_ENV"
          else
            exit 1
          fi

      - name: DMG and CLI archive
        run: |
          set -e
          mkdir -p build/dmg dist
          cp -R build/Locagens.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname Locagens -srcfolder build/dmg -ov -format UDZO dist/Locagens-macOS-universal.dmg
          (cd build && tar -czf ../dist/lcgn-macOS-universal.tar.gz lcgn)

      - name: Sign and notarize the DMG
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -e
          trap 'echo "::error::DMG signing failed at: $BASH_COMMAND"' ERR
          codesign --force --timestamp --sign "$SIGN_IDENTITY" dist/Locagens-macOS-universal.dmg
          if [ "$NOTARIZED" = "true" ]; then
            bash .github/scripts/notarize.sh dist/Locagens-macOS-universal.dmg
            xcrun stapler staple dist/Locagens-macOS-universal.dmg
          fi

      - name: Clean up the signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - uses: actions/upload-artifact@v4
        with:
          name: locagens-macos
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish to the GitHub Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          generate_release_notes: true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Set version from tag
        shell: bash
        run: bash .github/scripts/set-version.sh "$RELEASE_TAG"

      - name: Build
        run: cargo build --release --locked -p locagens-desktop -p locagens-cli

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/locagens.exe, target/release/lcgn.exe -DestinationPath dist/Locagens-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: locagens-windows
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish to the GitHub Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          generate_release_notes: true
