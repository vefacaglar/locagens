name: Release macOS DMG

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.2.0). Leave empty to build only without creating a release.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update package.json version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node -e "
            const fs = require('fs');
            const eventName = process.env.EVENT_NAME;
            const inputTagName = process.env.INPUT_TAG_NAME;
            const refName = process.env.REF_NAME;
            const tagName = eventName === 'workflow_dispatch' && inputTagName ? inputTagName : refName;
            const version = tagName.replace(/^v/, '');
            if (/^\d+\.\d+\.\d+/.test(version)) {
              console.log('Setting version to:', version);
              const paths = [
                'apps/desktop/package.json',
                'apps/api/package.json',
                'packages/shared/package.json'
              ];
              for (const pkgPath of paths) {
                if (fs.existsSync(pkgPath)) {
                  const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
                  pkg.version = version;
                  fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
                  console.log('Updated', pkgPath);
                }
              }
            } else {
              console.log('Skipping version update, using default version. Tag/Ref:', tagName);
            }
          "

      - name: Build all packages (db-writer + web + api + Electron)
        run: pnpm dist

      - name: List produced DMG
        run: ls -lh apps/desktop/release/

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: locagens-macos-dmg
          path: apps/desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release with DMG
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          files: apps/desktop/release/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: false
