[package]
name = "locagens-cli"
version = "0.2.0"
edition = "2021"
default-run = "lcgn"

[[bin]]
name = "lcgn"
path = "src/main.rs"

[dependencies]
locagens_core = { package = "locagens-core", path = "../../crates/core" }

[dev-dependencies]
axum = "0.7"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
