[package]
name = "locagens-backend"
version = "0.1.0"
edition = "2021"
description = "Locagens pure Rust core (locagens_core library + lcgn CLI) built on top of pi."

default-run = "lcgn"

[lib]
name = "locagens_core"
path = "src/lib.rs"

[[bin]]
name = "lcgn"
path = "src/bin/lcgn.rs"

[dependencies]
locagens-config = { path = "../../crates/config" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
dirs = "5.0"
regex = "1"
walkdir = "2"
url = "2"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
clap = { version = "4", features = ["derive"] }
rustyline = "14"
fs2 = "0.4"
rpassword = "7"
toml = "0.8"
locagens-protocol = { path = "../../crates/protocol" }
locagens-apply-patch = { path = "../../crates/apply-patch" }
locagens-execpolicy = { path = "../../crates/execpolicy" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
